basePath: /v1
definitions:
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Address:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Attachment:
    properties:
      content:
        type: string
      contentType:
        type: string
      filename:
        type: string
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.EmailResponse:
    properties:
      attempts:
        type: integer
      channel:
        type: string
      createdAt:
        type: string
      events:
        items:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.EventResponse'
        type: array
      from:
        $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Address'
      id:
        type: string
      idempotencyKey:
        type: string
      lastError:
        type: string
      metadata:
        items:
          type: integer
        type: array
      provider:
        type: string
      providerMessageId:
        type: string
      recipients:
        items:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.RecipientResponse'
        type: array
      sentAt:
        type: string
      status:
        type: string
      subject:
        type: string
      tags:
        additionalProperties:
          type: string
        type: object
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse:
    properties:
      error:
        example: validation_error
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        example: one or more fields are invalid
        type: string
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.EventResponse:
    properties:
      at:
        type: string
      data:
        items:
          type: integer
        type: array
      recipient:
        type: string
      type:
        type: string
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.PauseSendingRequest:
    properties:
      reason:
        type: string
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.RecipientResponse:
    properties:
      email:
        type: string
      lastEventAt:
        type: string
      name:
        type: string
      status:
        type: string
      type:
        type: string
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendEmailRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Attachment'
        type: array
      bcc:
        items:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Address'
        type: array
      cc:
        items:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Address'
        type: array
      from:
        $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Address'
      headers:
        additionalProperties:
          type: string
        type: object
      html:
        type: string
      idempotencyKey:
        type: string
      metadata:
        items:
          type: integer
        type: array
      replyTo:
        items:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Address'
        type: array
      subject:
        type: string
      tags:
        additionalProperties:
          type: string
        type: object
      text:
        type: string
      to:
        items:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.Address'
        type: array
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendEmailResponse:
    properties:
      createdAt:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendingStateResponse:
    properties:
      by:
        type: string
      paused:
        type: boolean
      reason:
        type: string
      since:
        type: string
    type: object
info:
  contact: {}
  description: Transactional email API for the Vibast notifications service. All routes
    require a bearer API key.
  title: Vibast Notifications API
  version: "1.0"
paths:
  /admin/sending:
    get:
      description: 'Returns the reputation circuit-breaker state: whether sending
        is paused and, if so, the reason, since when, and who paused it.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendingStateResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get sending state
      tags:
      - admin
  /admin/sending/pause:
    post:
      consumes:
      - application/json
      description: Manually pauses sending. Queued and newly accepted messages accumulate
        until sending is resumed. An optional reason is recorded.
      parameters:
      - description: Optional pause reason
        in: body
        name: request
        schema:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.PauseSendingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendingStateResponse'
        "400":
          description: bad_request
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Pause sending
      tags:
      - admin
  /admin/sending/resume:
    post:
      description: Manually resumes sending after an automatic or manual pause. The
        sweeper re-dispatches the queued backlog.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendingStateResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "403":
          description: forbidden
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resume sending
      tags:
      - admin
  /emails:
    post:
      consumes:
      - application/json
      description: Validate a send request, store it queued (or suppressed if every
        recipient is suppressed), and hand it to the dispatcher. Returns 202 for a
        new message and 200 for an idempotent replay of the same idempotencyKey.
      parameters:
      - description: Email to send
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Idempotent replay of an existing message
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendEmailResponse'
        "202":
          description: Accepted (new message)
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.SendEmailResponse'
        "400":
          description: validation_error
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "403":
          description: domain_not_allowed
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "413":
          description: payload_too_large
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Accept an email
      tags:
      - emails
  /emails/{id}:
    get:
      description: Returns the message status, recipients and event timeline. Bodies
        and attachment contents are never returned. 404 when the id is unknown or
        owned by another API key.
      parameters:
      - description: Message id (ULID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.EmailResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "404":
          description: not_found
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/github_com_vibast-solutions_ms-go-notifications_app_dto_v1.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an email's status and timeline
      tags:
      - emails
  /webhooks/ses:
    post:
      consumes:
      - application/json
      description: Receives AWS SNS deliveries carrying SES events. The SNS signature
        is verified and the topic ARN checked against the allow-list; there is no
        bearer auth. SubscriptionConfirmation messages are auto-confirmed; Notification
        messages update message/recipient state. Returns 200 once a message is verified
        (even for an unknown message id), 403 on a bad signature or disallowed topic,
        and 400 on a malformed body.
      produces:
      - application/json
      responses:
        "200":
          description: Accepted
        "400":
          description: Malformed SNS envelope
        "403":
          description: Bad signature or disallowed topic
        "500":
          description: Internal error
      summary: SES event webhook (SNS)
      tags:
      - webhooks
securityDefinitions:
  BearerAuth:
    description: 'Bearer API key, e.g. "Authorization: Bearer ntf_xxxxxxxx_…".'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
